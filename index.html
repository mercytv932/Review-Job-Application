<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <link rel="stylesheet" href="style.css">
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Job Application Trcaker</title>
  <style>
    body{
      background-color: rgb(18, 129, 76);
    }
  </style>
</head>
<body>
  <main class="app">
    <h1>Application Tracker</h1>

    <form class="application-form" id="application-form">
      <div class="form-group">
        <label for="company-input">Company Name</label>
        <input
          type="text"
          id="company-input"
          name="company"
          placeholder="Company name..."
          required
        />
      </div>

      <div class="form-group">
        <label for="position-input">Position</label>
        <input
          type="text"
          id="position-input"
          name="position"
          placeholder="Position..."
          required
        />
      </div>

      <div class="form-group">
        <label for="status-input">Application Status</label>
        <select
          id="status-input"
          name="applicationStatus"
          class="modern-dropdown"
          required
        >
          <option value="" disabled selected>Select status...</option>
          <option value="review">Review</option>
          <option value="interview">Interview</option>
          <option value="offer">Offer</option>
          <option value="rejected">Rejected</option>
        </select>
      </div>

      <button type="submit" class="add-button">Add</button>
    </form>

    <section class="controls">
      <div class="form-group">
        <label for="search-input">Search Applications</label>
        <input
          type="text"
          id="search-input"
          name="search"
          placeholder="Search applications..."
        />
      </div>

      <div class="form-group">
        <label for="status-filter">Filter by Status</label>
        <select
          id="status-filter"
          name="statusFilter"
          class="modern-dropdown"
        >
          <option value="all">All Applications</option>
          <option value="review">Review</option>
          <option value="interview">Interview</option>
          <option value="offer">Offer</option>
          <option value="rejected">Rejected</option>
        </select>
      </div>
    </section>

    <section class="dashboard-stats" id="app-stats">
      <div class="stat-card" id="stat-total">
        <h2 class="stat-title">Total Applications</h2>
        <p class="stat-value">12</p>
      </div>

      <div class="stat-card" id="stat-review">
        <h2 class="stat-title">In Review</h2>
        <p class="stat-value">0</p>
      </div>

      <div class="stat-card" id="stat-interview">
        <h2 class="stat-title">Interviewing</h2>
        <p class="stat-value">3</p>
      </div>

      <div class="stat-card" id="stat-offer">
        <h2 class="stat-title">Offers</h2>
        <p class="stat-value">1</p>
      </div>

      <div class="stat-card" id="stat-rejected">
        <h2 class="stat-title">Rejected</h2>
        <p class="stat-value">8</p>
      </div>
    </section>

    <section
      id="application-list-container"
      class="application-list"
      aria-live="polite"
    ></section>
  </main>

  <script>
    const applicationForm = document.querySelector("#application-form");

const companyInput = document.querySelector("#company-input");
const positionInput = document.querySelector("#position-input");
const statusInput = document.querySelector("#status-input");
const addButton = document.querySelector(".add-button");

const searchInput = document.querySelector("#search-input");
const statusFilter = document.querySelector("#status-filter");

const applicationListContainer = document.querySelector("#application-list-container");

const statTotal = document.querySelector("#stat-total .stat-value");
const statReview = document.querySelector("#stat-review .stat-value");
const statInterview = document.querySelector("#stat-interview .stat-value");
const statOffer = document.querySelector("#stat-offer .stat-value");
const statRejected = document.querySelector("#stat-rejected .stat-value");

const applications = [];

applicationForm.addEventListener("submit",(event)=>{
  event.preventDefault();
const company = companyInput.value;
const position = positionInput.value;
const status = statusInput.value;

const job = {
  company: company,
  position :position,
  status: status
}
applications.push(job);

renderApplications();

  companyInput.value = "";
  positionInput.value = "";
  statusInput.value = "";
});


function renderApplications(applicationsToShow = applications){
  applicationListContainer.innerHTML = "";
  console.log(applications);

  applicationsToShow.forEach((application, index) =>{

    const cardDiv = document.createElement("div");

    const companyP = document.createElement("p");
    companyP.textContent = application.company;

    const positionP = document.createElement("p");
    positionP.textContent = application.position;

    const statusP = document.createElement("p");
    statusP.textContent = application.status;

    const deleteBtn = document.createElement("button");
    deleteBtn.textContent = "Delete";

    deleteBtn.addEventListener("click", ()=>{
      applications.splice(index, 1);

      renderApplications();
    });

    cardDiv.appendChild(companyP);
    cardDiv.appendChild(positionP);
    cardDiv.appendChild(statusP);
    cardDiv.appendChild(deleteBtn);

    applicationListContainer.appendChild(cardDiv);
  });
}


function searchApplications(){
  const searchTerm = searchInput.value.toLowerCase();

  const filteredApplications = applications.filter(application =>{
    return(
      application.company.toLowerCase().includes(searchTerm) ||
      application.position.toLowerCase().includes(searchTerm)
    );
  })
  renderApplications(filteredApplications);
  }

  companyInput, searchInput.addEventListener("keydown", (event)=>{
    if(event.key==="Enter"){
      addButton.click();
    }
  });

  searchInput.addEventListener("input", searchApplications);
  </script>
</body>
</html>
