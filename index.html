<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Job Application Reviewer</title>
</head>

<body>
  <main class="app">
    <h1>Application Reviewer</h1>

    <form class="application-form" id="application-form">
      <div class="form-group">
        <label for="company-input">Company Name</label>
        <input
          type="text"
          id="company-input"
          name="company"
          placeholder="Company name..."
          required
        />
      </div>

      <div class="form-group">
        <label for="position-input">Position</label>
        <input
          type="text"
          id="position-input"
          name="position"
          placeholder="Position..."
          required
        />
      </div>

      <div class="form-group">
        <label for="status-input">Application Status</label>
        <select
          id="status-input"
          name="applicationStatus"
          class="modern-dropdown"
          required
        >
          <option value="" disabled selected>Select status...</option>
          <option value="review">Review</option>
          <option value="interview">Interview</option>
          <option value="offer">Offer</option>
          <option value="rejected">Rejected</option>
        </select>
      </div>

      <button type="submit" class="add-button">Add</button>
    </form>

    <section class="controls">
      <div class="form-group">
        <label for="search-input">Search Applications</label>
        <input
          type="text"
          id="search-input"
          name="search"
          placeholder="Search applications..."
        />
      </div>

      <div class="form-group">
        <label for="status-filter">Filter by Status</label>
        <select
          id="status-filter"
          name="statusFilter"
          class="modern-dropdown"
        >
          <option value="all">All Applications</option>
          <option value="review">Review</option>
          <option value="interview">Interview</option>
          <option value="offer">Offer</option>
          <option value="rejected">Rejected</option>
        </select>
      </div>
    </section>

    <section class="dashboard-stats" id="app-stats">
      <div class="stat-card" id="stat-total">
        <h2 class="stat-title">Total Applications</h2>
        <p class="stat-value">12</p>
      </div>

      <div class="stat-card" id="stat-review">
        <h2 class="stat-title">In Review</h2>
        <p class="stat-value">0</p>
      </div>

      <div class="stat-card" id="stat-interview">
        <h2 class="stat-title">Interviewing</h2>
        <p class="stat-value">3</p>
      </div>

      <div class="stat-card" id="stat-offer">
        <h2 class="stat-title">Offers</h2>
        <p class="stat-value">1</p>
      </div>

      <div class="stat-card" id="stat-rejected">
        <h2 class="stat-title">Rejected</h2>
        <p class="stat-value">8</p>
      </div>
    </section>

    <section
      id="application-list-container"
      class="application-list"
      aria-live="polite"
    ></section>
  </main>

  <script></script>
</body>
</html>
